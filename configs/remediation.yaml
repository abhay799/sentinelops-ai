remediation:
  version: v1

  planner:
    allowed_actions:
      - rollback
      - traffic_shift
      - restart

    minimum_causal_score: 0.65
    minimum_priority_score: 0.35
    minimum_net_benefit: 0.01

  output:
    plans:
      path: data/processed/remediation/remediation_plans_v1.parquet
