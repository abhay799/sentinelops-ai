rca_challenger:

  version: v1

  thresholds:
    support: 0.65
    reject: 0.35
    minimum_evidence: 2

  penalties:
    no_change_signal: 0.15
    weak_anomaly: 0.20
    stronger_alternative: 0.25
    no_graph_impact: 0.10

  bonuses:
    change_signal: 0.15
    strong_anomaly: 0.15
    graph_impact: 0.10
    primary_service: 0.10

  output:
    challenges:
      path: data/processed/rca/rca_challenges_v1.parquet
