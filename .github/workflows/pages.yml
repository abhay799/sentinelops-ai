name: Deploy static Pages site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            ui/portfolio/package-lock.json
      - name: Build portfolio
        working-directory: ui/portfolio
        run: |
          npm ci
          npm run build
      - name: Build Control Center static demo
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/control-center
          cp -R ui/portfolio/dist/. _site/
          cp -R frontend/dist/. _site/control-center/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
