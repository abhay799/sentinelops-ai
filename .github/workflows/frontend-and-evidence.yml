name: Frontend and Evidence

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Start local readiness dependencies
        run: |
          docker network create sentinelops-net
          docker compose -f infra/docker-compose.core.yml -f infra/docker-compose.kafka.yml up -d --wait --wait-timeout 120
      - name: Create local telemetry topic after Kafka starts
        run: |
          for attempt in $(seq 1 30); do
            if docker compose -f infra/docker-compose.kafka.yml exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic sentinelops.telemetry.raw --partitions 3 --replication-factor 1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker-compose.kafka.yml logs kafka
          exit 1
      - name: Run full Python test suite
        run: python -m pytest
      - name: Stop local readiness dependencies
        if: always()
        run: docker compose -f infra/docker-compose.core.yml -f infra/docker-compose.kafka.yml down
  frontend-and-evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run lint
      - run: npm run build
      - name: Parse evidence manifest
        working-directory: .
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/EVIDENCE_MANIFEST.json', 'utf8'))"
