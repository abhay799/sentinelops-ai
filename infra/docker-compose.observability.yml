services:

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinelops-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: sentinelops-grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: sentinelops_dev

    volumes:
      - sentinelops_grafana_data:/var/lib/grafana

    restart: unless-stopped


  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: sentinelops-otel

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

    volumes:
      - ../monitoring/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

    ports:
      - "4317:4317"
      - "4318:4318"

    restart: unless-stopped


volumes:
  sentinelops_grafana_data:
networks:
  default:
    name: sentinelops-net
    external: true
